services:
  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
      args:
        STT_MODEL: ${STT_MODEL:-small}
        STT_DEVICE: ${STT_DEVICE:-cpu}
        STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
    container_name: polytalk-stt
    restart: unless-stopped
    env_file:
      - ${POLYTALK_ENV_FILE:-.env}
    environment:
      STORAGE_DIR: /data
      MAX_UPLOAD_MB: ${STT_MAX_UPLOAD_MB:-200}
    volumes:
      - ./data/stt:/data
      # Mount STT app source for development (remove for production)
      - ./stt/app:/app/app:ro
    networks:
      - polytalk-network
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]

  tts:
    build:
      context: ./tts
      dockerfile: Dockerfile
    image: polytalk-tts:latest
    container_name: polytalk-tts
    restart: unless-stopped
    env_file:
      - ${POLYTALK_ENV_FILE:-.env}
    environment:
      PIPER_MODEL: ${TTS_MODEL:-en_GB-jenny_dioco-medium}
      PIPER_DATA_DIR: /data
    volumes:
      - ./tts/wsgi.py:/app/wsgi.py:ro
      - ./tts/voices:/data:ro
    networks:
      - polytalk-network

  supertonic-tts:
    build:
      context: ./supertonic_tts
      dockerfile: Dockerfile
    image: polytalk-supertonic-tts:latest
    container_name: polytalk-supertonic-tts
    restart: unless-stopped
    env_file:
      - ${POLYTALK_ENV_FILE:-.env}
    environment:
      XDG_CACHE_HOME: /data/cache
    volumes:
      - ./data/supertonic:/data
    networks:
      - polytalk-network

  polytalk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polytalk
    ports:
      - "127.0.0.1:9000:8000"
    env_file:
      - ${POLYTALK_ENV_FILE:-.env}
    environment:
      # The host port is fixed at 9000; the container always listens on 8000.
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    volumes:
      # Mount app source for development (remove for production)
      - ./app:/app/app:ro
      # Mount config files
      - ./config:/app/config:ro
      # Persist generated media files
      - ./media/output:/app/media/output
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - stt
      - tts
      - supertonic-tts
    networks:
      - polytalk-network

networks:
  polytalk-network:
    driver: bridge
